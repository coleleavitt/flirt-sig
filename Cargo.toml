[package]
name = "flirt-sig"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Cole Leavitt <cole@unwrap.rs>"]
description = "Reader and matcher for IDA FLIRT .sig signature files (versions 5 to 11), with reference-name checks and arbitration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coleleavitt/flirt-sig"
readme = "README.md"
keywords = ["flirt", "ida", "signatures", "reverse-engineering", "disassembly"]
categories = ["parser-implementations", "development-tools"]
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]

[features]
default = ["cli"]
# The `flirt-sig` command-line tool. Library users can turn it off with
# `default-features = false`, which drops `object` and `gimli`.
cli = ["dep:object", "dep:gimli"]

[[bin]]
name = "flirt-sig"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
flate2 = "1.1"
ruzstd = "0.9"
thiserror = "2"
gimli = { version = "0.34.0", default-features = false, features = ["read", "std"], optional = true }
object = { version = "0.40.0", default-features = false, features = ["read", "std"], optional = true }
